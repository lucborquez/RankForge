spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          # Cada ruta: si la URL entrante coincide con 'predicates', el gateway la reenvia
          # a 'uri'. lb:// significa "busca este nombre en Eureka y balancea la carga"
          # (en vez de localhost:8081, localhost:8082, etc. fijos).
          routes:
            - id: auth-service
              uri: ${AUTH_ROUTE:lb://auth-service}
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: ${USER_ROUTE:lb://user-service}
              predicates:
                - Path=/api/usuarios/**

            - id: game-service
              uri: ${GAME_ROUTE:lb://game-service}
              predicates:
                - Path=/api/juegos/**

            - id: team-service
              uri: ${TEAM_ROUTE:lb://team-service}
              predicates:
                - Path=/api/equipos/**

            - id: tournament-service
              uri: ${TOURNAMENT_ROUTE:lb://tournament-service}
              predicates:
                - Path=/api/torneos/**

            - id: registration-service
              uri: ${REGISTRATION_ROUTE:lb://registration-service}
              predicates:
                - Path=/api/inscripciones/**

            - id: match-service
              uri: ${MATCH_ROUTE:lb://match-service}
              predicates:
                - Path=/api/partidas/**

            - id: result-service
              uri: ${RESULT_ROUTE:lb://result-service}
              predicates:
                - Path=/api/resultados/**

            - id: ranking-service
              uri: ${RANKING_ROUTE:lb://ranking-service}
              predicates:
                - Path=/api/rankings/**

            - id: sanction-service
              uri: ${SANCTION_ROUTE:lb://sanction-service}
              predicates:
                - Path=/api/sanciones/**

# Punto de entrada unico: todo el trafico del frontend/Postman entra por aqui (puerto 8080).
server:
  port: 8080

# El gateway tambien es cliente Eureka, para poder resolver los lb://
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

rankforge:
  frontend-origins: "${FRONTEND_ORIGINS:http://localhost:5173,https://frontend-e-sports-arena-manager.vercel.app}"

jwt:
  secret: ${JWT_SECRET}